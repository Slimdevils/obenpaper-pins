name: Publish pins

# Obenpaper's own Pinterest publisher (Luc, 1 Oct 2026). Organic only.
# Every hour: validate the queue, keep the token alive, post what is due
# (max one pin per run), record it in posted_ids.json.

on:
  schedule:
    - cron: "17 * * * *"          # hourly, off the top of the hour
  workflow_dispatch:
    inputs:
      mode:
        description: "What to run"
        type: choice
        default: dry-run
        options: [dry-run, publish, list-boards]
  push:
    branches: [main]
    paths:
      - "pinterest-api/**"
      - "pins/**"
      - ".github/workflows/publish-pins.yml"

# Never two runs at once: a refresh token can only be spent once.
concurrency:
  group: pinterest-publish
  cancel-in-progress: false

permissions:
  contents: write

defaults:
  run:
    working-directory: pinterest-api

jobs:
  # On a push: run the tests and check the queue, so a bad edit shows a red
  # cross on the commit straight away.
  validate:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pinterest-api/requirements.txt
      - run: pip install -r requirements.txt
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Check the queue against the standing rules
        run: python validate_queue.py

  # Hourly / manual. Independent of the job above on purpose: the token must
  # be kept alive even while the queue is broken. The publisher re-runs the
  # same queue check itself and posts nothing while it has an error.
  publish:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    env:
      OBENPAPER_CLOUD: "1"
      MAX_POSTS_PER_RUN: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pinterest-api/requirements.txt
      - run: pip install -r requirements.txt

      - name: Keep the Pinterest token alive
        id: token
        env:
          PINTEREST_CLIENT_ID: ${{ secrets.PINTEREST_CLIENT_ID }}
          PINTEREST_CLIENT_SECRET: ${{ secrets.PINTEREST_CLIENT_SECRET }}
          PINTEREST_TOKEN: ${{ secrets.PINTEREST_TOKEN }}
          GH_TOKEN: ${{ secrets.PINTEREST_SECRETS_PAT }}
        run: python cloud_token.py

      - name: Publish due pins
        if: steps.token.outputs.configured == 'true' && (github.event_name == 'schedule' || inputs.mode == 'publish')
        env:
          PINTEREST_CLIENT_ID: ${{ secrets.PINTEREST_CLIENT_ID }}
          PINTEREST_CLIENT_SECRET: ${{ secrets.PINTEREST_CLIENT_SECRET }}
        run: python pinterest_publish.py

      - name: Dry run
        if: steps.token.outputs.configured == 'true' && inputs.mode == 'dry-run'
        env:
          PINTEREST_CLIENT_ID: ${{ secrets.PINTEREST_CLIENT_ID }}
          PINTEREST_CLIENT_SECRET: ${{ secrets.PINTEREST_CLIENT_SECRET }}
        run: python pinterest_publish.py --dry-run

      - name: List boards and IDs
        if: steps.token.outputs.configured == 'true' && inputs.mode == 'list-boards'
        env:
          PINTEREST_CLIENT_ID: ${{ secrets.PINTEREST_CLIENT_ID }}
          PINTEREST_CLIENT_SECRET: ${{ secrets.PINTEREST_CLIENT_SECRET }}
        run: python pinterest_boards.py

      # Runs even if publishing failed, so a pin that DID post is always
      # recorded and can never be posted twice.
      - name: Record posted pins and token dates
        if: always() && steps.token.outputs.configured == 'true'
        run: |
          git config user.name "obenpaper-publisher"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posted_ids.json state/
          if git diff --cached --quiet; then
            echo "Nothing to record."
            exit 0
          fi
          git commit -m "Record published pins / token dates [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 10
          done
          echo "::error::Could not push posted_ids.json — check it before the next run."
          exit 1
