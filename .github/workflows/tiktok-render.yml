name: TikTok render (review branch)

# Renders the TikTok story videos WITH the Kokoro voice-over and commits them
# back to this branch for review. Lives only on `tiktok-render` — never on
# main — so nothing here is ever queued without Luc's look (Luc, 12 Nov 2026).
# Runs in Actions because the voice model downloads are blocked in Claude's
# sandbox.

on:
  push:
    branches: [tiktok-render]
    paths:
      - "pin-studio/tiktok_story.py"
      - ".github/workflows/tiktok-render.yml"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install Pillow kokoro-onnx soundfile
      - name: Fetch the Kokoro voice model
        run: |
          mkdir -p /tmp/kokoro
          curl -sSL -o /tmp/kokoro/kokoro.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx
          curl -sSL -o /tmp/kokoro/voices.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
          ls -la /tmp/kokoro
      - name: Render all stories with voice-over
        run: python pin-studio/tiktok_story.py all --vo /tmp/kokoro --outdir tiktok/review
      - name: Commit the renders to this branch
        run: |
          git config user.name "obenpaper-publisher"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tiktok/review/
          git commit -m "Render TikTok story videos for review [skip ci]" || exit 0
          git push origin HEAD:tiktok-render
